# AIUI gateway sample configuration
# -----------------------------------------------------------------------------
# Single source of truth for everything you can configure on the gateway. Drop
# a file named `aiui.config.yaml` (`.yml` / `.json` also work, or point at one
# with the AIUI_CONFIG_PATH env var) anywhere in the search order below and
# the gateway will pick it up on boot.
#
# Search order (first match wins):
#   1. $AIUI_CONFIG_PATH
#   2. ./aiui.config.{yaml,yml,json}
#   3. ./.config/aiui.{yaml,yml,json}
#   4. $XDG_CONFIG_HOME/aiui.{yaml,yml,json}     (or ~/.config/...)
#
# Strings support ${ENV_VAR} interpolation, e.g. `api_key: ${OPENAI_API_KEY}`.
# Env vars that are already set ALWAYS take precedence over this file —
# production deployments can override individual fields via secret injection.

# ---- Secrets -------------------------------------------------------------
# AES-256-GCM master key used to encrypt every stored Provider API key. KEEP
# IT SECRET. Rotating it makes existing encrypted keys unreadable.
master_key: ${AIUI_MASTER_KEY}

# ---- Storage -------------------------------------------------------------
# SQLite file location. Relative paths resolve against your current working
# directory (the dir you invoked `aiui` from). Default: <cwd>/data/aiui.db.
# This field only takes effect via the `aiui` CLI — set AIUI_DB_PATH if you
# bypass the CLI.
# database:
#   path: ./data/aiui.db

# ---- Server --------------------------------------------------------------
# Listen address. CLI flags (-p / -H) still win.
# server:
#   port: 3000
#   hostname: 0.0.0.0

# ---- Admin bootstrap -----------------------------------------------------
# Created on first boot if the users table is empty.
admin:
  username: admin
  password: ${AIUI_ADMIN_PASSWORD}

# ---- Session ------------------------------------------------------------
# How long an authenticated browser session lasts. Default: 30 days.
# session:
#   ttl_days: 30

# ---- Caching -----------------------------------------------------------
# Per-provider /models discovery cache TTL. Set to 0 to disable caching.
# cache:
#   models_ttl_seconds: 300

# ---- Providers ----------------------------------------------------------
# Models are NOT configured here — they are discovered live from each
# provider's /models endpoint. Use the admin UI to register per-model
# overrides (Azure deployment names, display-name aliases, context-window
# pinning).
providers:
  - name: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    document_page: https://platform.openai.com/docs
    model_page: https://platform.openai.com/docs/models
    # Optional dedicated health endpoint. Must return {"status":"ok"} when
    # healthy. If omitted, the provider Check action falls back to
    # probing /models via the adapter.
    # health_check_url: https://status.openai.com/api/v2/status.json

  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}

  # Azure OpenAI — the catalog endpoint returns base model names
  # (gpt-4o, ...), NOT callable deployment names. Register your
  # deployments in the admin UI under Models, mapping a display name to
  # its deployment id. The `azure-openai` adapter wraps each request into
  # `/openai/deployments/<deployment>/chat/completions?api-version=…`.
  # - name: azure-eastus
  #   adapter_id: azure-openai
  #   base_url: https://my-resource.openai.azure.com
  #   api_version: "2024-10-21"
  #   api_key: ${AZURE_OPENAI_API_KEY}

  # Azure AI Foundry (Inference) hosts OSS / partner models (Mistral,
  # Llama, xAI Grok, Phi, …) behind a strict OpenAI-compatible surface.
  # The `azure-foundry` adapter:
  #   - reads the rich /models metadata (capabilities, RateLimits,
  #     model.Publisher, etc.) and surfaces it in the admin UI
  #   - auto-strips OpenAI-only fields (stream_options, parallel_tool_calls,
  #     …) that Foundry's `extra-parameters: error` default rejects
  # No more `default_params: stream_options: null` workarounds needed.
  # - name: foundry
  #   adapter_id: azure-foundry
  #   base_url: https://my-foundry.services.ai.azure.com
  #   api_key: ${AZURE_FOUNDRY_API_KEY}
