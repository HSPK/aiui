name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to build from"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      # One place decides what this build *is*, because three later steps
      # need to agree on it. Deriving it from `github.ref` directly does not
      # work for `workflow_dispatch`: there `github.ref` is the branch the
      # workflow file lives on, not the ref being built, so a manual run of a
      # release tag used to build the right code and then publish it as
      # `:edge`. That made the dispatch path useless as a recovery route,
      # which is exactly when you need it.
      - name: Resolve build context
        id: ctx
        run: |
          ref="${{ inputs.ref || github.ref }}"
          version="${ref#refs/tags/}"
          if [ "${version#v}" != "$version" ]; then
            # arm64 is emulated and a full Next.js build there takes ~30 min,
            # so releases pay for it and `main` does not.
            {
              echo "release=true"
              echo "version=$version"
              echo "platforms=linux/amd64,linux/arm64"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "release=false"
              echo "version="
              echo "platforms=linux/amd64"
            } >> "$GITHUB_OUTPUT"
          fi

      # `type=sha` in metadata-action reads github.sha, which on a dispatch
      # is the branch head rather than the ref we just checked out.
      - name: Record the commit actually checked out
        id: rev
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `value=` pins every version-derived tag to the ref resolved above
          # rather than to github.ref, so tag pushes and manual dispatches
          # produce identical results.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.release == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.ctx.outputs.release == 'true' }}
            type=raw,value=edge,enable=${{ steps.ctx.outputs.release == 'false' && github.event_name == 'push' }}
            type=raw,value=sha-${{ steps.rev.outputs.short }}
          labels: |
            org.opencontainers.image.title=Loom
            org.opencontainers.image.description=Self-hosted AI testing platform — model & MCP playground, full request logs, and an OpenAI-compatible gateway.
            org.opencontainers.image.documentation=https://hspk.github.io/loom
            org.opencontainers.image.licenses=MIT

      # Build amd64 first and keep it local. The unit and Playwright suites
      # run against the repo, so nothing they do can catch an image that
      # boots fine but whose CLI passthrough is broken — which is exactly
      # what shipped once. Smoke it before anything reaches the registry;
      # the push below reuses these layers from cache.
      - name: Build amd64 for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: loom:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: ./scripts/docker-smoke.sh loom:smoke

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.ctx.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Platforms: \`${{ steps.ctx.outputs.platforms }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
