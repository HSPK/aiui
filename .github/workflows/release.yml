name: Release tarball to GitHub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to release from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Next.js + CLI + external aliases)
        run: bun run build

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Run e2e suite
        run: bun run test:e2e

      - name: Pack tarball
        id: pack
        run: |
          set -e
          npm pack
          name=$(node -p "require('./package.json').name.replace('@','').replace('/','-')")
          version=$(node -p "require('./package.json').version")
          tarball="${name}-${version}.tgz"
          test -f "$tarball"
          # Stable alias filename so the GitHub "/releases/latest/download/"
          # redirect works (which requires a known asset name independent
          # of version). Same bytes, two names — npm/bun de-dup by URL so
          # there's no cost to publishing both.
          alias_tarball="${name}.tgz"
          cp "$tarball" "$alias_tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "alias_tarball=$alias_tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh "$tarball" "$alias_tarball"

      - name: Resolve release tag
        id: tag
        run: |
          set -e
          ref="${{ inputs.ref || github.ref_name }}"
          # When triggered by tag push, github.ref_name is the tag.
          # When triggered manually, inputs.ref is a tag or SHA — use it directly.
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.alias_tarball }}
          body: |
            ## Install

            **Install script** (Linux / macOS):

                curl -fsSL https://raw.githubusercontent.com/HSPK/loom/main/install.sh | sh -s -- --version ${{ steps.pack.outputs.version }}

            **Docker**:

                docker run -d -p 3000:3000 -v loom-data:/data ghcr.io/hspk/loom:${{ steps.pack.outputs.version }}

            **Tarball** — latest:

                bun add -g https://github.com/HSPK/loom/releases/latest/download/loom.tgz

            **Tarball** — pinned:

                bun add -g https://github.com/HSPK/loom/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.pack.outputs.tarball }}

            Already installed? `loom update`.

            Docs: https://hspk.github.io/loom
          generate_release_notes: true
          fail_on_unmatched_files: true
