name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to publish from"
        required: true
        type: string

permissions:
  contents: read
  # Required for npm trusted publisher (OIDC). npm validates the
  # token issued by GitHub Actions instead of using an NPM_TOKEN secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm CLI is the publisher — trusted publisher needs >= 11.5.1)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Next.js + CLI + external aliases)
        run: bun run build

      - name: Run e2e suite
        run: bun run test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          npm --version
          node --version
          npm config get registry
          npm whoami
          npm publish --access public
