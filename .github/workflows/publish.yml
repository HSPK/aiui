name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to publish from"
        required: true
        type: string

permissions:
  contents: read
  # Required for npm trusted publisher (OIDC). npm validates the
  # token issued by GitHub Actions instead of using an NPM_TOKEN secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm CLI is the publisher — trusted publisher needs >= 11.5.1)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Next.js + CLI + external aliases)
        run: bun run build

      - name: Run e2e suite
        run: bun run test

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          echo "--- npm config ---"
          npm config get registry
          npm --version
          node --version
          echo "--- OIDC claim (sub) ---"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | python3 -c "import sys,json,base64; t=json.load(sys.stdin)['value']; p=t.split('.')[1]; p+='='*(4-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print('sub:', c.get('sub')); print('repo:', c.get('repository')); print('workflow_ref:', c.get('workflow_ref')); print('job_workflow_ref:', c.get('job_workflow_ref')); print('event_name:', c.get('event_name')); print('ref:', c.get('ref'))"
          fi
          echo "--- publish ---"
          npm publish --access public --loglevel verbose 2>&1 | tail -40
