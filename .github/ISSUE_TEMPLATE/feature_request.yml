name: Feature request
description: Suggest a capability, provider, or integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Loom to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Loom?
      options:
        - Playground
        - Gateway (/api/v1)
        - MCP
        - Request logs
        - Providers / models
        - CLI or install
        - Docker / deployment
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
